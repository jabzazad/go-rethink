services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017" # so `go run .` on the host and MongoDB Compass can reach it
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017 # overrides the host URI in .env
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
